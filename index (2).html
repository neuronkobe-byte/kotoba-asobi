<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2654e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>麻雀ことばあそび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
/* Layout: single column notebook — a coral-to-peach band header, soft white tiles for every question, coral tile edge as the signature */
:root{
  --bg:#fff4ec; --surface:#fffaf6; --tile:#ffffff; --tile-edge:#f3d8ca;
  --ink:#4a332d; --muted:#8c6c62; --line:#f1dccf;
  --felt:#e2654e; --peach:#f6a685; --felt-ink:#ffffff; --felt-soft:#fde4da;
  --chun:#d64f6c; --chun-soft:#fce2e8; --gold:#d98c1d; --gold-soft:#fdf0d6; --sun:#ffe08a;
  --ok:#2f9a7c; --ok-soft:#dcf2e9;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#251a17; --surface:#2f2320; --tile:#352824; --tile-edge:#1a1210;
  --ink:#f8ece5; --muted:#c9ada3; --line:#4b3832;
  --felt:#f2917a; --peach:#d97b63; --felt-ink:#2a1915; --felt-soft:#4a2c25;
  --chun:#f38ca2; --chun-soft:#45252c; --gold:#f3bd5c; --gold-soft:#44341c; --sun:#fff1c4;
  --ok:#6ccfaa; --ok-soft:#1f3a30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#251a17; --surface:#2f2320; --tile:#352824; --tile-edge:#1a1210;
  --ink:#f8ece5; --muted:#c9ada3; --line:#4b3832;
  --felt:#f2917a; --peach:#d97b63; --felt-ink:#2a1915; --felt-soft:#4a2c25;
  --chun:#f38ca2; --chun-soft:#45252c; --gold:#f3bd5c; --gold-soft:#44341c; --sun:#fff1c4;
  --ok:#6ccfaa; --ok-soft:#1f3a30; color-scheme:dark}
.band h1,.meter-row b,.mode .glyph,.combo,.tile .q-term,.feedback .verdict,.result-hero .rank,.result-hero .score b{font-weight:900}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* header band */
.band{background:linear-gradient(135deg,var(--felt),var(--peach));color:var(--felt-ink);border-radius:0 0 22px 22px;padding:22px 20px 20px;margin-inline:-16px;margin-bottom:22px}
.school{font-size:12px;letter-spacing:.12em;opacity:.85}
.band h1{font-family:var(--display);font-size:34px;line-height:1.2;margin-top:4px;letter-spacing:.04em}
.meter{margin-top:14px;display:grid;gap:6px}
.meter-row{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.meter-row b{font-family:var(--display);font-size:20px}
.bar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--felt-ink) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:5px;transition:width .5s}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;gap:2px;text-align:center}
.lv b{font-size:17px}
.lv span{font-size:11.5px;color:var(--muted);line-height:1.4}
.lv[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.lv[aria-pressed="true"] span{color:inherit;opacity:.9}
.lv-note{font-size:13px;color:var(--muted);margin:8px 0 0}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:24px 0 10px}

/* mode tiles */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{background:var(--tile);border:1px solid var(--line);border-bottom:6px solid var(--felt);border-radius:14px;padding:16px 14px 14px;text-align:left;display:grid;gap:4px;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode:active{transform:translateY(1px)}
.mode .glyph{font-family:var(--display);font-size:26px;line-height:1;color:var(--felt)}
.mode:nth-child(2) .glyph{color:var(--chun)}
.mode:nth-child(3) .glyph{color:var(--gold)}
.mode strong{font-size:16px}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.5}
.sub-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500}
.ghost:hover{border-color:var(--felt)}
.ghost.weak{border-color:var(--chun);color:var(--chun)}
.ghost:disabled{opacity:.4;cursor:default}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 18px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* quiz */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.topbar .ghost{padding:6px 14px}
.prog{flex:1;display:grid;gap:4px}
.prog .bar{background:var(--line)}
.prog .bar i{background:var(--felt)}
.prog small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.combo{font-family:var(--display);color:var(--chun);font-size:15px;min-width:64px;text-align:right}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}

.tile{background:var(--tile);border:1px solid var(--line);border-bottom:10px solid var(--felt);border-radius:18px;padding:22px 20px 24px;box-shadow:0 2px 0 var(--tile-edge),0 10px 24px -14px rgba(0,0,0,.35);position:relative}
.tile .cat{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--felt);background:var(--felt-soft);border-radius:6px;padding:2px 8px}
.tile .q-hint{font-size:13px;color:var(--muted);margin-top:10px}
.tile .q-text{font-size:18px;font-weight:500;margin-top:4px;line-height:1.75}
.tile .q-term{font-family:var(--display);font-size:42px;line-height:1.25;margin-top:10px;letter-spacing:.04em;word-break:keep-all;overflow-wrap:anywhere}
.tile .q-read{color:var(--muted);font-size:15px;margin-top:2px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--chun);color:transparent;line-height:1.1;user-select:none}

.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--felt)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt .t{min-width:0;flex:1}
.opt .t b{font-size:18px}
.opt .t em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.opt .t p{margin:0;font-size:14.5px;line-height:1.65}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.wrong{border-color:var(--chun);background:var(--chun-soft)}
.opt.wrong .k{background:var(--chun);color:var(--bg);border-color:var(--chun)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}

.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px}
.feedback .verdict{font-family:var(--display);font-size:20px}
.feedback.good .verdict{color:var(--ok)}
.feedback.bad .verdict{color:var(--chun)}
.feedback .ans{font-weight:700}
.feedback .ans small{color:var(--muted);font-weight:400;margin-left:6px}
.feedback p{margin:0;font-size:14.5px}
.primary{background:var(--felt);color:var(--felt-ink);border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;width:100%;margin-top:14px}
.primary:hover{filter:brightness(1.07)}

/* result */
.result-hero{text-align:center;padding-block:28px 10px}
.result-hero .rank{font-family:var(--display);font-size:56px;line-height:1.15;color:var(--chun);letter-spacing:.06em}
.result-hero .score{font-size:20px;font-variant-numeric:tabular-nums;margin-top:6px}
.result-hero .score b{font-family:var(--display);font-size:30px}
.result-hero p{color:var(--muted);margin:6px 0 0}
.miss{display:grid;gap:10px}
.miss-item{background:var(--tile);border:1px solid var(--line);border-left:5px solid var(--chun);border-radius:10px;padding:10px 14px}
.miss-item b{font-size:17px}
.miss-item small{color:var(--muted);margin-left:6px}
.miss-item p{margin:2px 0 0;font-size:14px}
.btn-row{display:grid;gap:10px;margin-top:22px}
.btn-row .primary{margin:0}
.btn-row .ghost{border-radius:12px;padding:12px}

/* flash cards */
.card-stage{perspective:1200px;margin-top:6px}
.flip{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;border:0;background:none;width:100%;padding:0;text-align:left}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg)}
.face.front{align-items:center;text-align:center}
.face .tap{font-size:12px;color:var(--muted);margin-top:auto}
.face .back-term{font-weight:700;font-size:20px}
.face .back-term small{color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
.face .back-desc{font-size:17px;line-height:1.8;margin-top:10px}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.mode,.combo.pop{animation:none;transition:none}}
.card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.card-actions button{border-radius:12px;padding:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.card-actions .yet{color:var(--chun);border-color:var(--chun)}
.card-actions .got{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}

/* list */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.group h3{font-size:14px;letter-spacing:.1em;color:var(--felt);margin:22px 0 8px;font-weight:700}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px;min-width:2.2em}
.row .nm{font-weight:700;font-size:16px}
.row .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.row .nm .ok{display:inline-block;font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:2px}
.row p{grid-column:2;margin:0;font-size:14px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px}
.confirm{display:inline-flex;gap:8px;align-items:center;margin-top:6px}
@media (max-width:420px){.band h1{font-size:28px}.tile .q-term{font-size:34px}.result-hero .rank{font-size:46px}}
</style>

</head>
<body>
<div class="wrap">

<!-- HOME -->
<section id="home">
  <div class="band">
    <div class="school">ニューロン麻雀スクール神戸校</div>
    <h1>麻雀ことばあそび</h1>
    <div class="meter">
      <div class="meter-row"><span>おぼえた用語</span><span><b id="m-count">0</b> / <span id="m-total">125</span></span></div>
      <div class="bar"><i id="m-bar" style="width:0%"></i></div>
    </div>
  </div>

  <div class="label">レベル</div>
  <div class="levels" id="levels">
    <button class="lv" data-lv="1" id="lv-1"><b>初級</b><span>はじめての方</span></button>
    <button class="lv" data-lv="2" id="lv-2"><b>中級</b><span>対局に慣れてきた方</span></button>
    <button class="lv" data-lv="3" id="lv-3"><b>経験者</b><span>全125語に挑戦</span></button>
  </div>
  <p class="lv-note" id="lv-note"></p>

  <div class="label">あそびかた</div>
  <div class="modes">
    <button class="mode" data-mode="m2t" id="mode-m2t"><span class="glyph">意→語</span><strong>意味から用語</strong><span>説明を読んで、正しい用語を選ぶ</span></button>
    <button class="mode" data-mode="t2m" id="mode-t2m"><span class="glyph">語→意</span><strong>用語から意味</strong><span>用語を見て、正しい説明を選ぶ</span></button>
    <button class="mode" data-mode="read" id="mode-read"><span class="glyph">読</span><strong>読み方クイズ</strong><span>「嶺上牌」はなんと読む？漢字の用語に挑戦</span></button>
    <button class="mode" data-mode="cards" id="mode-cards"><span class="glyph">札</span><strong>単語カード</strong><span>めくって確認。覚えたらチェック</span></button>
  </div>
  <div class="sub-actions">
    <button class="ghost weak" id="btn-weak">苦手だけ復習 <span id="weak-n">0</span>語</button>
    <button class="ghost" id="btn-list">用語一覧を見る</button>
  </div>

  <div class="label">出題する分野（複数選べます）</div>
  <div class="chips" id="chips"></div>

  <div class="label">問題数</div>
  <div class="seg" id="count-seg">
    <button data-n="10" aria-pressed="true">10問</button>
    <button data-n="20" aria-pressed="false">20問</button>
    <button data-n="0" aria-pressed="false">全部</button>
  </div>

  <footer>
    全125語・ニューロン麻雀スクール神戸校 教材「麻雀用語一覧」より<br>
    記録はこの端末のブラウザに保存されます　<button id="btn-reset">記録をリセット</button>
    <div id="reset-confirm" hidden class="confirm"><span>本当に消しますか？</span><button class="ghost" id="reset-yes">消す</button><button class="ghost" id="reset-no">やめる</button></div>
  </footer>
</section>

<!-- QUIZ -->
<section id="quiz" hidden>
  <div class="topbar">
    <button class="ghost" id="quit">やめる</button>
    <div class="prog"><div class="bar"><i id="q-bar"></i></div><small id="q-pos">1 / 10</small></div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="tile" id="q-tile"></div>
  <div class="opts" id="opts"></div>
  <div id="fb"></div>
</section>

<!-- RESULT -->
<section id="result" hidden>
  <div class="result-hero">
    <div class="rank" id="r-rank">満貫</div>
    <div class="score"><b id="r-score">8</b> / <span id="r-total">10</span> 問正解</div>
    <p id="r-msg"></p>
  </div>
  <div id="r-miss-wrap">
    <div class="label">まちがえた用語</div>
    <div class="miss" id="r-miss"></div>
  </div>
  <div class="btn-row">
    <button class="primary" id="r-retry-miss">まちがえた用語をもう一度</button>
    <button class="ghost" id="r-again">同じ設定でもう一回</button>
    <button class="ghost" id="r-home">トップへ戻る</button>
  </div>
</section>

<!-- CARDS -->
<section id="cards" hidden>
  <div class="topbar">
    <button class="ghost" id="c-quit">戻る</button>
    <div class="prog"><div class="bar"><i id="c-bar"></i></div><small id="c-pos">1 / 10</small></div>
    <div class="combo" id="c-got"></div>
  </div>
  <div class="card-stage">
    <button class="flip" id="flip" aria-label="カードをめくる">
      <div class="face front tile" id="c-front"></div>
      <div class="face back tile" id="c-back"></div>
    </button>
  </div>
  <div class="card-actions">
    <button class="yet" id="c-yet">まだ覚えてない</button>
    <button class="got" id="c-ok">覚えた！</button>
  </div>
</section>

<!-- LIST -->
<section id="list" hidden>
  <div class="topbar"><button class="ghost" id="l-quit">戻る</button><div style="flex:1"></div></div>
  <input class="search" id="l-search" type="search" placeholder="用語・読み・説明で検索（例：テンパイ）">
  <div id="l-body"></div>
</section>

</div>

<script>
const CATS=["試合の単位","場","プレイヤー","ルール","点数","牌","ドラ","ツモと捨て牌","鳴き","門前・喰い","面子（牌の組み合わせ）","アガリ","待ち","テンパイ・立直","戦術","ペナルティー"];
// [分野, 用語, 読み, 解説, 同義グループ]
const RAW=[
[0,"局","キョク","麻雀ゲームの試合単位。配牌からアガる勝者が出るまで、或いは誰もアガらない流局までが1局。"],
[0,"流局","リュウキョク","だれもアガれずに1局が終わること。「流れる」などとも言う。"],
[0,"半荘","ハンチャン","麻雀ゲームの試合単位（1ゲーム）。前半戦の東場（トンバ）と後半戦の南場（ナンバ）で、東4局・南4局の全8局。"],
[0,"東風戦","トンプウセン","麻雀ゲームの試合単位。親が1回ずつ回る東場（トンバ）の全4局、或いは東場で終了するゲーム方法。"],
[0,"オーラス","","ゲームの最後の1局。半荘（ハンチャン）戦の場合は南4局目のこと。"],
[0,"ゲームの回る向き","","人は左回り。麻雀牌は右回り。"],
[1,"場","バ","起家（チーチャ）から始まり、4人のプレイヤー全員が左回りで1度ずつ親になる1周のこと。"],
[1,"東場","トンバ","親を順番に担当する1周目。"],
[1,"南場","ナンバ","親を順番に担当する2周目。"],
[1,"積み棒","ツミボウ","親が連荘（レンチャン）している目印として卓上に置く100点棒のこと。"],
[1,"一本場","イッポンバ","親の連荘（レンチャン）或いは流局（リュウキョク）によって、積み棒を1本卓上に出した状態。"],
[1,"連荘","レンチャン","親がアガった時、または流局時にテンパイしていた時に、親をもう一度続けること。"],
[1,"開門","カイメン","配牌の時、親のサイコロの出目に従って牌山を切り開くこと。"],
[2,"親","オヤ","配牌を取り始める人。アガリ点数を1.5倍もらえる。"],
[2,"子","コ","親以外のプレイヤー。"],
[2,"起家","チーチャ","半荘（ハンチャン）で東1局の最初の親など、対局開始時の最初の親のこと。"],
[2,"上家","カミチャ","自分から見て左隣の人。"],
[2,"下家","シモチャ","自分から見て右隣の人。"],

const LV_INFO={
  1:{n:3,note:"基本の用語から出題。選択肢は3つで、まぎらわしい答えは出ません。"},

try{level=+(localStorage.getItem("neuron-yogo-level")||1)||1}catch(e){}
const levelItems=()=>DATA.filter(d=>d.lv<=level);
const hasKanji=s=>/[一-鿿]/.test(s);
const canRead=d=>d.read&&hasKanji(d.term);

// ---- storage ----
const KEY="neuron-yogo-dojo-v1";
let store={stats:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.stats)store=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const st=id=>store.stats[id]||(store.stats[id]={s:0,c:0,w:0});
const mastered=id=>(store.stats[id]?.s||0)>=2;
const isWeak=id=>{const x=store.stats[id];return x&&x.w>0&&x.s<2};
function record(id,ok){const x=st(id);if(ok){x.c++;x.s++}else{x.w++;x.s=0}save()}

// ---- helpers ----
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const readTxt=d=>d.read?d.read.replace("・","／"):"";
function masked(d){
  let t=esc(d.desc);
  const keys=[d.term.replace(/る$/,""),...(d.read?d.read.split("・"):[])].filter(k=>k.length>=1).sort((a,b)=>b.length-a.length);
  for(const k of keys){t=t.split(esc(k)).join('<span class="blank">'+"＿".repeat(2)+'</span>')}
  return t;
}
function show(id){for(const s of ["home","quiz","result","cards","list"])$("#"+s).hidden=s!==id;window.scrollTo(0,0)}

// ---- home ----
let selCats=new Set();let qCount=10;
function renderHome(){
  const L=levelItems();
  document.querySelectorAll(".lv").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===level));
  $("#lv-note").textContent=LV_INFO[level].note;
  const m=L.filter(d=>mastered(d.id)).length;
  $("#m-count").textContent=m;$("#m-total").textContent=L.length;
  $("#m-bar").style.width=(m/L.length*100)+"%";
  const w=L.filter(d=>isWeak(d.id)).length;
  $("#weak-n").textContent=w;$("#btn-weak").disabled=w===0;
  for(const i of [...selCats])if(!L.some(d=>d.cat===i))selCats.delete(i);
  const chips=$("#chips");chips.innerHTML="";
  const all=document.createElement("button");
  all.className="chip";all.setAttribute("aria-pressed",selCats.size===0);
  all.innerHTML=`すべて<small>${L.length}</small>`;
  all.onclick=()=>{selCats.clear();renderHome()};chips.appendChild(all);
  CATS.forEach((c,i)=>{
    const items=L.filter(d=>d.cat===i);
    if(!items.length)return;
    const mm=items.filter(d=>mastered(d.id)).length;
    const b=document.createElement("button");b.className="chip";b.id="chip-"+i;
    b.setAttribute("aria-pressed",selCats.has(i));
    b.innerHTML=`${c}<small>${mm}/${items.length}</small>`;
    b.onclick=()=>{selCats.has(i)?selCats.delete(i):selCats.add(i);renderHome()};
    chips.appendChild(b);
  });
}

  qCount=+b.dataset.n;document.querySelectorAll("#count-seg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
const pool=()=>levelItems().filter(d=>selCats.size===0||selCats.has(d.cat));
document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{

// ---- quiz ----
let Q=null;
function startQuiz(mode,items,useAll){
  let list=mode==="read"?items.filter(canRead):items.filter(d=>mode!=="m2t"||d.term!=="ゲームの回る向き");
  if(!list.length){list=mode==="read"?levelItems().filter(canRead):levelItems()}
  list=shuffle(list);
  if(!useAll&&qCount>0)list=list.slice(0,qCount);
  Q={mode,items:list,i:0,score:0,combo:0,miss:[],src:items,useAll};
  show("quiz");renderQ();
}
function distractors(d,mode){
  const ok=x=>x.id!==d.id&&(!d.grp||x.grp!==d.grp)&&x.desc!==d.desc&&(mode!=="read"||(canRead(x)&&x.read!==d.read));
  const n=LV_INFO[level].n-1;
  let src=levelItems().filter(ok);
  if(src.length<n)src=DATA.filter(ok);
  const same=shuffle(src.filter(x=>x.cat===d.cat));
  const other=shuffle(src.filter(x=>x.cat!==d.cat));
  if(level===1)return other.concat(same).slice(0,n);   // 初級：違う分野から選ぶので見分けやすい
  if(level===2)return shuffle(src).slice(0,n);         // 中級：ばらばらに混ぜる
  return same.concat(other).slice(0,n);                // 経験者：同じ分野の似た用語
}
function renderQ(){
  const d=Q.items[Q.i],n=Q.items.length;
  $("#q-pos").textContent=`${Q.i+1} / ${n}`;
  $("#q-bar").style.width=(Q.i/n*100)+"%";
  $("#combo").textContent=Q.combo>=2?`${Q.combo}連続！`:"";
  const tile=$("#q-tile");
  if(Q.mode==="m2t"){
    tile.innerHTML=`<span class="cat">${CATS[d.cat]}</span><div class="q-hint">この説明にあてはまる用語は？</div><div class="q-text">${masked(d)}</div>`;
  }else if(Q.mode==="t2m"){
    tile.innerHTML=`<span class="cat">${CATS[d.cat]}</span><div class="q-hint">この用語の意味は？</div><div class="q-term">${esc(d.term)}</div>${d.read?`<div class="q-read">${readTxt(d)}</div>`:""}`;
  }else{
    tile.innerHTML=`<span class="cat">${CATS[d.cat]}</span><div class="q-hint">なんと読む？</div><div class="q-term">${esc(d.term)}</div>`;
  }
  const opts=shuffle([d,...distractors(d,Q.mode)]);
  Q.opts=opts;Q.answered=false;
  const box=$("#opts");box.innerHTML="";
  opts.forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";b.id="opt-"+k;
    let body;
    if(Q.mode==="m2t")body=`<b>${esc(o.term)}</b>${o.read?`<em>${readTxt(o)}</em>`:""}`;
    else if(Q.mode==="t2m")body=`<p>${masked(o)}</p>`;
    else body=`<b>${readTxt(o)}</b>`;
    b.innerHTML=`<span class="k">${k+1}</span><span class="t">${body}</span>`;
    b.onclick=()=>answer(k);box.appendChild(b);
  });
  $("#fb").innerHTML="";
}
function answer(k){
  if(Q.answered)return;Q.answered=true;
  const d=Q.items[Q.i],ok=Q.opts[k].id===d.id;
  record(d.id,ok);
  document.querySelectorAll("#opts .opt").forEach((b,j)=>{
    b.disabled=true;
    if(Q.opts[j].id===d.id)b.classList.add("correct");
    else if(j===k)b.classList.add("wrong");else b.classList.add("dim");
  });
  if(ok){Q.score++;Q.combo++;}else{Q.combo=0;Q.miss.push(d)}
  const c=$("#combo");c.textContent=Q.combo>=2?`${Q.combo}連続！`:"";
  if(Q.combo>=2){c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
  const praise=["正解！","お見事！","その通り！","ナイス！"];
  const last=Q.i===Q.items.length-1;
  $("#fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">
    <div class="verdict">${ok?praise[Math.random()*praise.length|0]:"ざんねん…"}</div>
    <div class="ans">${esc(d.term)}<small>${readTxt(d)}</small></div>
    <p>${esc(d.desc)}</p></div>
    <button class="primary" id="next">${last?"結果を見る":"次の問題へ"}</button>`;
  $("#next").onclick=next;$("#next").focus({preventScroll:true});
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){Q.i++;if(Q.i>=Q.items.length)showResult();else{renderQ();window.scrollTo({top:0,behavior:"smooth"})}}
$("#quit").onclick=()=>{show("home");renderHome()};
document.addEventListener("keydown",e=>{
  if($("#quiz").hidden)return;
  if(!Q.answered&&/^[1-4]$/.test(e.key)&&+e.key<=Q.opts.length)answer(+e.key-1);
  else if(Q.answered&&(e.key==="Enter"||e.key===" ")&&document.activeElement?.id!=="next"){e.preventDefault();next()}
});

// ---- result ----
function rankOf(p){
  if(p===1)return["役満","全問正解！用語は完璧です。"];
  if(p>=.8)return["跳満","あと少しで全問正解。この調子！"];
  if(p>=.6)return["満貫","しっかり身についてきました。"];
  if(p>=.4)return["三翻","まちがえた用語を見直してみましょう。"];
  return["一翻","まずは単語カードでゆっくり覚えよう。"];
}
function showResult(){
  const n=Q.items.length,[r,msg]=rankOf(Q.score/n);
  $("#r-rank").textContent=r;$("#r-score").textContent=Q.score;$("#r-total").textContent=n;$("#r-msg").textContent=msg;
  $("#r-miss-wrap").hidden=!Q.miss.length;$("#r-retry-miss").hidden=!Q.miss.length;
  $("#r-miss").innerHTML=Q.miss.map(d=>`<div class="miss-item"><b>${esc(d.term)}</b><small>${readTxt(d)}</small><p>${esc(d.desc)}</p></div>`).join("");
  show("result");
}
$("#r-retry-miss").onclick=()=>startQuiz(Q.mode,Q.miss,true);
$("#r-again").onclick=()=>startQuiz(Q.mode,Q.src,Q.useAll);
$("#r-home").onclick=()=>{show("home");renderHome()};

// ---- cards ----
let C=null;
function startCards(items){C={items:shuffle(items),i:0,got:0};show("cards");renderCard()}
function renderCard(){
  const d=C.items[C.i],n=C.items.length;
  $("#flip").classList.remove("on");
  $("#c-pos").textContent=`${C.i+1} / ${n}`;$("#c-bar").style.width=(C.i/n*100)+"%";
  $("#c-got").textContent=C.got?`覚えた ${C.got}`:"";
  $("#c-front").innerHTML=`<span class="cat">${CATS[d.cat]}</span><div class="q-term">${esc(d.term)}</div>${d.read?`<div class="q-read">${readTxt(d)}</div>`:""}<div class="tap">タップしてめくる</div>`;
  $("#c-back").innerHTML=`<span class="cat">${CATS[d.cat]}</span><div class="back-term" style="margin-top:12px">${esc(d.term)}<small>${readTxt(d)}</small></div><div class="back-desc">${esc(d.desc)}</div><div class="tap">タップで表に戻る</div>`;
}
$("#flip").onclick=()=>$("#flip").classList.toggle("on");
function cardNext(ok){
  const d=C.items[C.i];record(d.id,ok);if(ok)C.got++;
  C.i++;
  if(C.i>=C.items.length){show("home");renderHome();return}
  renderCard();
}
$("#c-ok").onclick=()=>cardNext(true);
$("#c-yet").onclick=()=>cardNext(false);
$("#c-quit").onclick=()=>{show("home");renderHome()};

// ---- list ----
function renderList(){
  const q=$("#l-search").value.trim();
  const hit=d=>!q||(d.term+d.read+d.desc).includes(q);
  let html="";
  CATS.forEach((c,i)=>{
    const items=DATA.filter(d=>d.cat===i&&hit(d));
    if(!items.length)return;
    html+=`<div class="group"><h3>${c}</h3>`+items.map(d=>`<div class="row"><span class="no">${d.id}</span><div class="nm">${esc(d.term)}${d.read?`<small>${readTxt(d)}</small>`:""}${mastered(d.id)?'<span class="ok">覚えた</span>':""}</div><p>${esc(d.desc)}</p></div>`).join("")+`</div>`;
  });
  $("#l-body").innerHTML=html||`<div class="empty">「${esc(q)}」にあてはまる用語はありません</div>`;
}
$("#l-search").oninput=renderList;
$("#l-quit").onclick=()=>{show("home");renderHome()};

// ---- reset ----
$("#btn-reset").onclick=()=>{$("#reset-confirm").hidden=false};
$("#reset-no").onclick=()=>{$("#reset-confirm").hidden=true};
$("#reset-yes").onclick=()=>{store={stats:{}};save();$("#reset-confirm").hidden=true;renderHome()};

renderHome();
</script>
